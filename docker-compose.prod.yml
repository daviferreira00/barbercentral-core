services:
  app:
    image: barbercentral-core-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: barbercentral-backend-prod
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - target: 8080
        published: 8081
        protocol: tcp
        mode: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      update_config:
        order: start-first

volumes:
  barbercentral-db-data-prod:
