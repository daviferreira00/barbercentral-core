services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: barbercentral-backend-prod
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8081:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  barbercentral-db-data-prod:
